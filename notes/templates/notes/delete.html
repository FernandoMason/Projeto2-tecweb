{% extends "notes/base.html" %}

{% block content %}
<form class="form-card form-card-page" method="post">
  {% csrf_token %}
  <h2 class="page-title">Apagar anotação</h2>
  <p class="page-text">
    Tem certeza que quer apagar esta anotação? Essa ação não pode ser desfeita.
  </p>

  <div class="card card-color-3 card-preview">
    <div class="card-header">
      <h3 class="card-title">{{ note.title }}</h3>
    </div>
    <div class="card-content">
      <p>{{ note.content }}</p>
    </div>
  </div>

  <div class="form-actions">
    <a class="btn btn-secondary" href="{% url 'index' %}">Cancelar</a>
    <button class="btn btn-danger" type="submit">Apagar</button>
  </div>
</form>
{% endblock %}
